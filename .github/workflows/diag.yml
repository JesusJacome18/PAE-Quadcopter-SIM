name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: diag
        shell: pwsh
        run: |
          $env:DIAG_OUT = "diag.txt"
          python packaging/diag_win.py
          $t = (Get-Content diag.txt -Raw) -replace "%","%25" -replace "`r","" -replace "`n","%0A"
          Write-Output "::notice title=diag::$t"
